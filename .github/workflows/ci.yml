name: CI
on: [push, pull_request]

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:
  tests:
    name: Tests
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      -   name: Checkout
          uses: actions/checkout@v3
      -   name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: ${{ matrix.php-version }}
      -   name: Clone phpseclib v3 and update tests
          run: |
            git clone -b 3.0 --single-branch https://github.com/phpseclib/phpseclib.git temp
            mv temp/tests tests
            rm -rf tests/Functional
            rm -rf tests/Unit/Net
            rm tests/Unit/Math/BigInteger/BCMathTest.php
            rm tests/Unit/Math/BigInteger/GMPTest.php
            rm tests/Unit/Math/BigInteger/PHP32Test.php
            rm tests/Unit/Math/BigInteger/PHP64Test.php
            rm tests/Unit/Math/BigInteger/PHP64OpenSSLTest.php
            rm -rf tests/Unit/Math/PrimeField
            rm -rf tests/Unit/Crypt/AES/
            rm tests/Unit/Crypt/BlowfishTest.php
            rm tests/Unit/Crypt/ChaCha20Test.php
            rm tests/Unit/Crypt/DESTest.php
            rm tests/Unit/Crypt/DHTest.php
            rm tests/Unit/Crypt/GCMTest.php
            rm tests/Unit/Crypt/HashTest.php
            rm tests/Unit/Crypt/RC2Test.php
            rm tests/Unit/Crypt/RC4Test.php
            rm tests/Unit/Crypt/Salsa20Test.php
            rm tests/Unit/Crypt/TripleDESTest.php
            rm tests/Unit/Crypt/EC/CurveTest.php
            rm tests/Unit/File/ANSITest.php
            rm tests/Unit/File/ASN1Test.php
            php .github/workflows/update.php
      -   name: Composer Install
          run: composer install --classmap-authoritative --no-interaction
      -   name: Make Tests Compatiable With PHPUnit 7+
          if: matrix.php-version != '7.0'
          run: php tests/make_compatible_with_phpunit7.php
      -   name: Make Tests Compatiable With PHPUnit 9+
          if: matrix.php-version != '7.0' && matrix.php-version != '7.1' && matrix.php-version != '7.2'
          run: php tests/make_compatible_with_phpunit9.php
      -   name: Make Tests Compatiable With PHPUnit 12+
          if: matrix.php-version != '7.0' && matrix.php-version != '7.1' && matrix.php-version != '7.2' && matrix.php-version != '7.3' && matrix.php-version != '7.4' && matrix.php-version != '8.0'
          run: php tests/make_compatible_with_phpunit12.php
      -   name: Setup Secure Shell Functional Tests
          if: matrix.os == 'ubuntu-latest'
          run: |
            PHPSECLIB_SSH_USERNAME='phpseclib'
            PHPSECLIB_SSH_PASSWORD='EePoov8po1aethu2kied1ne0'
            
            sudo useradd --create-home --base-dir /home "$PHPSECLIB_SSH_USERNAME"
            echo "$PHPSECLIB_SSH_USERNAME:$PHPSECLIB_SSH_PASSWORD" | sudo chpasswd
            ssh-keygen -t rsa -b 1024 -f "$HOME/.ssh/id_rsa" -q -N ""
            eval `ssh-agent -s`
            ssh-add "$HOME/.ssh/id_rsa"
            sudo mkdir -p "/home/$PHPSECLIB_SSH_USERNAME/.ssh/"
            sudo cp "$HOME/.ssh/id_rsa.pub" "/home/$PHPSECLIB_SSH_USERNAME/.ssh/authorized_keys"
            sudo ssh-keyscan -t rsa localhost > "/tmp/known_hosts"
            sudo cp "/tmp/known_hosts" "/home/$PHPSECLIB_SSH_USERNAME/.ssh/known_hosts"
            sudo chown "$PHPSECLIB_SSH_USERNAME:$PHPSECLIB_SSH_USERNAME" "/home/$PHPSECLIB_SSH_USERNAME/.ssh/" -R
            
            # on some runners (the AWS-hosted ones) sshd refuses passwords, which fails every password
            # login test. turn them on in a file that sorts first in sshd_config.d, since sshd keeps the
            # first value it reads
            echo 'PasswordAuthentication yes' | sudo tee /etc/ssh/sshd_config.d/00-phpseclib.conf
            
            # OpenSSH 9.8+ penalizes sources that make lots of connections without
            # authenticating and then refuses all connections from that source,
            # localhost included. turn that off. older sshd versions don't know the
            # option (and would refuse to start with it) so only set it if supported
            if sudo sshd -T 2>/dev/null | grep -qi '^persourcepenalties '; then
                echo 'PerSourcePenalties no' | sudo tee -a /etc/ssh/sshd_config.d/00-phpseclib.conf
            fi
            sudo sshd -t
            sudo systemctl restart ssh
            # check that password logins took
            sudo sshd -T -C "user=$PHPSECLIB_SSH_USERNAME,host=localhost,addr=127.0.0.1" | grep -x 'passwordauthentication yes'
            
            echo "PHPSECLIB_SSH_HOSTNAME=localhost" >> $GITHUB_ENV
            echo "PHPSECLIB_SSH_USERNAME=$PHPSECLIB_SSH_USERNAME" >> $GITHUB_ENV
            echo "PHPSECLIB_SSH_PASSWORD=$PHPSECLIB_SSH_PASSWORD" >> $GITHUB_ENV
            echo "PHPSECLIB_SSH_HOME=/home/phpseclib" >> $GITHUB_ENV
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
      -   name: PHPUnit
          run: vendor/bin/phpunit
      -   name: Show sshd Log
          if: failure() && matrix.os == 'ubuntu-latest'
          run: sudo journalctl -u ssh -u ssh.socket --no-pager | tail -n 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']